name: Test and review python workflow

on: push

jobs:
  job_python:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code on runner VM
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests
